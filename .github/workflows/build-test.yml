name: build & test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [latest]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run build
    - run: npx playwright install
    - run: npm run test
